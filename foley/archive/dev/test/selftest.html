    const d = b.getChannelData(0); const sr = b.sampleRate; let peak = 0, sum = 0; for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; sum += v * v; }

  };
  const golden = {};
  for (const bank in Foley.Factory) for (const p of Foley.Factory[bank]) { const pad = Foley.Store.migratePad(JSON.parse(JSON.stringify(p))); await check('pad:' + bank + '/' + p.name, pad); try { golden[bank + '/' + p.name] = fingerprint(await Foley.Engine.render(pad, 12345)); } catch (e) { } }

  // 4) determinism
  const p = Foley.Store.migratePad({ layers: [{ gen: 'footstep', params: {} }] });
  Foley.Engine.cache.clear(); const a = await Foley.Engine.render(p, 42); Foley.Engine.cache.clear(); const b = await Foley.Engine.render(p, 42);
  let same = a.length === b.length, maxd = 0, nd = 0, first = -1; if (same) { const x = a.getChannelData(0), y = b.getChannelData(0); for (let i = 0; i < x.length; i++) { const d = Math.abs(x[i] - y[i]); if (d > 0) { nd++; if (first < 0) first = i; if (d > maxd) maxd = d; } } same = maxd < 1e-3; } // Chrome's renderer is not bit-exact (~1 ULP drift); require perceptual identity

  { Foley.Engine.cache.clear(); const c = await Foley.Engine.render(p, 43); let m = 0; const x = a.getChannelData(0), y = c.getChannelData(0); for (let i = 0; i < Math.min(x.length, y.length); i++) m = Math.max(m, Math.abs(x[i] - y[i])); if (a.length !== c.length || m > 0.05) { pass++; log('PASS seeds differ'); } else { fail++; log('FAIL seeds produce identical output'); } }

  const wav = Foley.Engine.encodeWav(a); if (wav.size === 44 + a.length * 4) { pass++; log('PASS wav size ' + wav.size); } else { fail++; log('FAIL wav size ' + wav.size); }
  } catch (e) { fail++; log('FAIL EXCEPTION: ' + (e && e.stack || e)); }
  log('\nSUMMARY pass=' + pass + ' fail=' + fail + ' consoleErrors=' + errs.length);
  errs.forEach(e => log('  ERR ' + e));
  document.title = 'DONE pass=' + pass + ' fail=' + fail;
})();
